<!DOCTYPE html>
<html>
  <head>
  <title>sam-javascript</title>
  <style>
    a {
      font-size: 70px;
      font-weight: bold;
      text-align: center;    
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 3s;
    }

    .link:hover {
      background-color: red;
    }

    .link-text {
      transition: color 1s;
      color: black;
    }

    .link-text:hover {
      color: black;
    }

    .link-text:active {
      color: green;
    }

  </style>
</head>
<body>
  <h1>WELLCOME TO SAM.HTML</h1>
  <h2>PLEASE CLICK THE LINK BELOW</h2>
  <div class="link">
   <a class="link-text" href="https://live.staticflickr.com/6068/6065510171_bb00e7222b_z.jpg" target="_blank">click me!</a>
  </div>
 
</body>
</html>
